name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run test suite
        run: dotnet test Hitch.sln -c Release
      - name: Verify Linux PTY helper and packaged app
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/Hitch/Hitch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/linux-ci
          test -x artifacts/linux-ci/hitch
          test -x artifacts/linux-ci/hitch-pty
          artifacts/linux-ci/hitch --version
          artifacts/linux-ci/hitch --help
